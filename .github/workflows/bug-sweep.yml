# Bug Sweep — Monster House Highrise world
#
# The AUTOMATIC bug sweep. Nobody has to remember to run it:
#   * it runs on every push (same checks as Build Checks), and
#   * it runs on a weekly schedule even if nothing changed, so a problem
#     that sneaks in (or a checker that rots) gets caught on its own.
#
# It does not duplicate the check logic — it calls build.yml as a reusable
# workflow, so a sweep is always identical to a normal build check.
#
# If a SCHEDULED sweep fails, the "report" job opens a GitHub issue
# (or comments on the one already open) so the failure is waiting in the
# repo instead of being silently buried in the Actions tab.

name: Bug Sweep

on:
  push:
  schedule:
    # Mondays 14:00 UTC (~6-7am Los Angeles). Cron is always UTC on GitHub.
    - cron: "0 14 * * 1"
  workflow_dispatch: # lets a human fire a sweep by hand, any time

permissions:
  contents: read

jobs:
  sweep:
    name: Run all build checks
    uses: ./.github/workflows/build.yml

  report:
    name: Open an issue if the scheduled sweep failed
    needs: sweep
    # Only for scheduled runs that failed — push failures already show up
    # as a red X on the commit, no issue needed for those.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or update the bug-sweep issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🐛 Automatic bug sweep failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled bug sweep failed. Something in the repo no longer passes the checks",
              "(JSON manifests, Lua syntax, or the 08-qa tests) — or a checker itself broke.",
              "",
              `Failed run: ${runUrl}`,
              "",
              "Open the run, read the summary at the bottom of the page, and fix the failed check.",
              "This issue was opened automatically by .github/workflows/bug-sweep.yml."
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing. Latest failed sweep: ${runUrl}`
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body
              });
              core.info(`Opened issue #${created.data.number}`);
            }
