# Bug Department — Monster House Highrise world
#
# A PERMANENT department that lives entirely on GitHub's machines.
# It does NOT need Muse, an agent, or the user to be awake or to have
# any Muse usage left: GitHub Actions runs it on GitHub's own runners,
# on this schedule, whether anyone is watching or not.
#
# What it does, in order:
#   1. AUTO-FIX lane — runs 09-bug-department/auto_fixer.py, which fixes
#      only provably safe mechanical issues (JSON trailing commas +
#      normalize, Lua trailing whitespace). If it changed anything, the
#      changes are committed straight back as github-actions[bot] with
#      the message "bug-department: auto-fix", and checks then run on
#      the FIXED files.
#   2. CHECK lane — the same checks as Build Checks: every JSON parses,
#      every Lua file passes luac -p, and 08-qa/sweep.py passes.
#   3. REPORT lane — if checks still fail after auto-fix, an issue
#      titled "🐛 Bug Department: sweep failing" (label: bug-department)
#      is opened — or commented on if one is already open, never a
#      duplicate. When a later run goes green, it comments
#      "✅ Sweep green again" on that issue and closes it.
#
# Triggers: every push, every 6 hours on a schedule (cron, UTC —
# GitHub's minimum practical cadence for this; chosen over daily so a
# break is caught the same day), and manual dispatch.
#
# Loop safety: pushes made with the built-in GITHUB_TOKEN do not
# trigger new workflow runs (GitHub rule), and the department job also
# skips runs whose actor is github-actions[bot] — the auto-fix commit
# can never retrigger the department.
#
# HONEST LIMITS: this department fixes punctuation-level problems and
# reports everything else. It cannot fix design or logic bugs, and it
# cannot do the Highrise Studio Play/Upload step. See
# 09-bug-department/DEPARTMENT.md.

name: Bug Department

on:
  push:
  schedule:
    # Every 6 hours, at :23 past the hour (off the top-of-hour rush).
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # the auto-fix lane commits its fixes back
  issues: write   # the report lane opens/comments/closes its issue

jobs:
  department:
    name: Auto-fix, then run all checks
    runs-on: windows-latest
    # Loop guard (see header): never run for the bot's own pushes.
    if: github.actor != 'github-actions[bot]'
    outputs:
      checks_failed: ${{ steps.verdict.outputs.checks_failed }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------- Lane 1: AUTO-FIX -------------------------------
      - name: Auto-fix safe mechanical issues
        id: fixer
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bd"
          python 09-bug-department/auto_fixer.py --root . 2>&1 | tee "$RUNNER_TEMP/bd/fixer.txt"

      - name: Commit auto-fixes back (if anything changed)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Auto-fixer changed nothing — no commit."
          else
            git commit -m "bug-department: auto-fix"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Auto-fixes committed and pushed as github-actions[bot]."
          fi

      # ---------------- Lane 2: CHECKS (same as Build Checks) ----------
      - name: Validate all JSON manifests
        id: json
        continue-on-error: true
        shell: python
        run: |
          import json, pathlib, sys
          files = sorted(
              p for p in pathlib.Path(".").rglob("*.json")
              if ".git" not in p.parts and ".github" not in p.parts
          )
          if not files:
              print("No JSON files found yet - check skipped.")
              sys.exit(0)
          bad = []
          for f in files:
              try:
                  json.loads(f.read_text(encoding="utf-8"))
                  print(f"OK    {f}")
              except Exception as e:
                  bad.append(f)
                  print(f"BAD   {f}: {e}")
          print(f"\n{len(files) - len(bad)}/{len(files)} JSON files valid.")
          sys.exit(1 if bad else 0)

      # FIX (pipeline-fix): same fix as build.yml — the old URL pointed
      # at a SourceForge folder that does not exist ("5.4.2/Windows64_bin/";
      # the real folder is "5.4.2/Tools Executables/"), so the download
      # 404'd on every run. Now: both official endpoints, retries, a
      # zip-magic check (error pages are HTML), and a luac smoke test.
      - name: Install Lua on the runner
        id: lua_install
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $urls = @(
            "https://sourceforge.net/projects/luabinaries/files/5.4.2/Tools%20Executables/lua-5.4.2_Win64_bin.zip/download",
            "https://downloads.sourceforge.net/project/luabinaries/5.4.2/Tools%20Executables/lua-5.4.2_Win64_bin.zip"
          )
          $zip = Join-Path $env:RUNNER_TEMP "lua.zip"
          $dest = Join-Path $env:RUNNER_TEMP "lua"
          $ok = $false
          foreach ($url in $urls) {
            for ($try = 1; $try -le 3 -and -not $ok; $try++) {
              try {
                Write-Host "Downloading Lua from $url (attempt $try)"
                Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 10
                # A real zip starts with 'PK'; an error page is HTML.
                $bytes = [System.IO.File]::ReadAllBytes($zip)
                if ($bytes.Length -gt 10000 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
                  $ok = $true
                } else {
                  Write-Warning "Download was not a zip file ($($bytes.Length) bytes) - retrying"
                }
              } catch {
                Write-Warning "Download failed: $($_.Exception.Message)"
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "Could not download the official Lua binaries zip from SourceForge." }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $luac = Get-ChildItem -Path $dest -Recurse -Filter "luac*.exe" | Select-Object -First 1
          if (-not $luac) { throw "No luac executable found inside the downloaded zip." }
          $luac.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $luac.FullName -v
          Get-ChildItem $dest

      - name: Syntax-check all Lua files (luac -p)
        id: lua
        continue-on-error: true
        shell: bash
        run: |
          LUAC=""
          for c in luac54 luac lua54 lua; do
            if command -v "$c" >/dev/null 2>&1; then LUAC="$c"; break; fi
          done
          if [ -z "$LUAC" ]; then
            echo "No Lua interpreter found on PATH - the install step must have failed."
            exit 1
          fi
          check_one() {
            if [[ "$LUAC" == luac* ]]; then "$LUAC" -p "$1";
            else "$LUAC" -e "assert(loadfile(arg[1]))" "$1"; fi
          }
          mapfile -t files < <(find . -name "*.lua" -not -path "./.git/*" | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Lua files found yet - check skipped."
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
            if check_one "$f"; then echo "OK    $f"; else echo "BAD   $f"; fail=1; fi
          done
          echo ""
          echo "${#files[@]} Lua file(s) checked with $LUAC."
          exit $fail

      - name: Run the QA bug sweep (08-qa/sweep.py)
        id: sweep
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -f "08-qa/sweep.py" ]; then
            python 08-qa/sweep.py 2>&1 | tee "$RUNNER_TEMP/bd/sweep.txt"
          else
            echo "08-qa/sweep.py not present yet - sweep skipped."
          fi

      # ---------------- Verdict + report file --------------------------
      - name: Verdict and department report
        id: verdict
        if: always()
        shell: bash
        run: |
          verdict() { [ "$1" = "success" ] && echo "PASS" || echo "FAIL"; }
          FAILED=0
          for o in '${{ steps.fixer.outcome }}' '${{ steps.json.outcome }}' \
                   '${{ steps.lua_install.outcome }}' '${{ steps.lua.outcome }}' \
                   '${{ steps.sweep.outcome }}'; do
            if [ "$o" != "success" ]; then FAILED=1; fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "checks_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "checks_failed=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## 🐛 Bug Department — run report"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Auto-fix (safe mechanical issues) | $(verdict '${{ steps.fixer.outcome }}') |"
            echo "| JSON manifests valid | $(verdict '${{ steps.json.outcome }}') |"
            echo "| Lua install | $(verdict '${{ steps.lua_install.outcome }}') |"
            echo "| Lua syntax (luac -p) | $(verdict '${{ steps.lua.outcome }}') |"
            echo "| QA bug sweep (08-qa/sweep.py) | $(verdict '${{ steps.sweep.outcome }}') |"
            echo ""
            echo "Note: the auto-fixer only fixes punctuation-level issues"
            echo "(JSON trailing commas, Lua trailing whitespace). Anything"
            echo "still failing here needs a real fix — see the step logs."
          } | tee "$RUNNER_TEMP/bd/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" = "1" ]; then
            {
              echo ""
              echo "----- auto-fixer log (tail) -----"
              tail -n 40 "$RUNNER_TEMP/bd/fixer.txt" 2>/dev/null || true
              echo ""
              echo "----- QA sweep log (tail) -----"
              tail -n 80 "$RUNNER_TEMP/bd/sweep.txt" 2>/dev/null || true
            } >> "$RUNNER_TEMP/bd/report.md"
            echo "BUG DEPARTMENT: checks failing after auto-fix — see summary."
            exit 1
          fi
          echo "BUG DEPARTMENT: all green."

      - name: Upload the department report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-department-report
          path: ${{ runner.temp }}/bd/
          if-no-files-found: ignore

  report:
    name: File or close the bug-department issue
    needs: department
    if: always() && needs.department.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download the department report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bug-department-report
          path: bd-report

      - name: Open, update, or close the issue
        uses: actions/github-script@v7
        env:
          CHECKS_FAILED: ${{ needs.department.outputs.checks_failed }}
        with:
          script: |
            const fs = require("fs");
            const title = "🐛 Bug Department: sweep failing";
            const label = "bug-department";
            const failed = process.env.CHECKS_FAILED === "true";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Make sure the label exists (creating an issue with a
            // missing label errors out, so create it first if needed).
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: label
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: "d73a4a",
                description: "Filed automatically by the Bug Department workflow"
              });
            }
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: label, per_page: 100
            });
            const existing = open.data.find(i => i.title === title);
            if (failed) {
              let detail = "";
              try {
                detail = fs.readFileSync("bd-report/report.md", "utf8");
                if (detail.length > 6000) detail = detail.slice(0, 6000) + "\n…(truncated — full report is in the run artifacts)";
              } catch (e) {
                detail = "(report file unavailable — open the run for step-by-step logs)";
              }
              const body = [
                "The Bug Department sweep is failing even after the auto-fix lane ran.",
                "Whatever is listed below is NOT a punctuation-level problem — it needs a real fix.",
                "",
                `Run: ${runUrl}`,
                "",
                detail
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Still failing.\n\n${body}`
                });
                core.info(`Commented on existing issue #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: title, body: body, labels: [label]
                });
                core.info(`Opened issue #${created.data.number}`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ Sweep green again — all Bug Department checks pass.\n\nRun: ${runUrl}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: "closed"
              });
              core.info(`Closed issue #${existing.number} (green again)`);
            } else {
              core.info("Checks green and no open bug-department issue — nothing to file.");
            }
